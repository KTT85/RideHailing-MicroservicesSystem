services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env}
      MYSQL_USER_PASSWORD: ${MYSQL_USER_PASSWORD:?Copy .env.example to .env}
      MYSQL_DRIVER_PASSWORD: ${MYSQL_DRIVER_PASSWORD:?Copy .env.example to .env}
      MYSQL_TRIP_PASSWORD: ${MYSQL_TRIP_PASSWORD:?Copy .env.example to .env}
      MYSQL_PAYMENT_PASSWORD: ${MYSQL_PAYMENT_PASSWORD:?Copy .env.example to .env}
      MYSQL_NOTIFICATION_PASSWORD: ${MYSQL_NOTIFICATION_PASSWORD:?Copy .env.example to .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -uroot --execute='SELECT 1' --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
  rabbitmq:
    image: rabbitmq:4-management
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Copy .env.example to .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Copy .env.example to .env}
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  user-service:
    build: ./src/user-service
    ports: ["127.0.0.1:8081:8080"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MYSQL_HOST: mysql
      MYSQL_USERNAME: user_app
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
  driver-service:
    build: ./src/driver-service
    ports: ["127.0.0.1:8082:8080"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MYSQL_HOST: mysql
      MYSQL_USERNAME: driver_app
      MYSQL_PASSWORD: ${MYSQL_DRIVER_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
  trip-service:
    build: ./src/trip-service
    ports: ["127.0.0.1:8083:8080"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MYSQL_HOST: mysql
      MYSQL_USERNAME: trip_app
      MYSQL_PASSWORD: ${MYSQL_TRIP_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
  payment-service:
    build: ./src/payment-service
    ports: ["127.0.0.1:8085:8080"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MYSQL_HOST: mysql
      MYSQL_USERNAME: payment_app
      MYSQL_PASSWORD: ${MYSQL_PAYMENT_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
  notification-service:
    build: ./src/notification-service
    ports: ["127.0.0.1:8086:8080"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MYSQL_HOST: mysql
      MYSQL_USERNAME: notification_app
      MYSQL_PASSWORD: ${MYSQL_NOTIFICATION_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
  matching-service:
    build: ./src/matching-service
    ports: ["127.0.0.1:8084:8080"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      DRIVER_SERVICE_URL: http://driver-service:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
volumes:
  rabbitmq-data:
  mysql-data:
