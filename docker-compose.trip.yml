name: ridehailing-trip
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: trip_app
      MYSQL_PASSWORD: ${TRIP_DB_PASSWORD:?Set TRIP_DB_PASSWORD}
      MYSQL_DATABASE: trip_db
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["trip-mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -utrip_app trip_db --execute='SELECT 1' --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.12-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["trip-rabbit:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD-SHELL", "gosu rabbitmq rabbitmq-diagnostics -q check_running && gosu rabbitmq rabbitmq-diagnostics -q check_port_connectivity"]
      start_period: 30s
      interval: 5s
      timeout: 20s
      retries: 20
  trip:
    build:
      context: .
      dockerfile: deploy/trip-service/Dockerfile.integrated
    environment:
      MYSQL_TRIP_PASSWORD: ${TRIP_DB_PASSWORD:?Set TRIP_DB_PASSWORD}
      RABBITMQ_URL: ${TRIP_RABBITMQ_URL:?Set TRIP_RABBITMQ_URL with rabbitmq hostname}
    ports: ["127.0.0.1:8083:8000"]
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
volumes:
  trip-mysql-data:
  trip-rabbit:
