server:
  port: ${SERVER_PORT:8080}
spring:
  sql:
    init:
      mode: always
  application:
    name: trip-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/trip_db?connectionTimeZone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:trip_app}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        type:
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
        jdbc:
          time_zone: UTC
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 1
management:
  endpoints:
    web:
      exposure:
        include: info
