server:
  port: ${SERVER_PORT:8080}
app:
  http:
    max-request-body-bytes: ${MAX_REQUEST_BODY_BYTES:65536}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:ds03-user-service}
    expires-in-seconds: ${JWT_EXPIRES_IN_SECONDS:3600}
spring:
  application:
    name: user-service
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/user_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=DISABLED&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:user_app}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
