# Enable with SPRING_PROFILES_ACTIVE=local when running outside Docker.
server:
  port: ${SERVER_PORT:8081}

spring:
  jpa:
    hibernate:
      ddl-auto: validate
  rabbitmq:
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

management:
  health:
    rabbit:
      enabled: false
