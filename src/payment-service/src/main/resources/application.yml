server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: payment-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/payment_db}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
