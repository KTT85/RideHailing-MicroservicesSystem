server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/payment_db?connectionTimeZone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:payment_app}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        default-requeue-rejected: false
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  payment:
    max-attempts: ${PAYMENT_MAX_ATTEMPTS:5}
    retry-seconds: ${PAYMENT_RETRY_SECONDS:5}
    worker-delay-ms: ${PAYMENT_WORKER_DELAY_MS:1000}
    max-message-bytes: 65536
    simulator:
      pay: ${PAYMENT_SIMULATOR_PAY:SUCCESS}
      refund: ${PAYMENT_SIMULATOR_REFUND:SUCCESS}
      transient-attempts: ${PAYMENT_SIMULATOR_TRANSIENT_ATTEMPTS:0}
