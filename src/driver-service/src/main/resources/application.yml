server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:ds03-user-service}
  internal-token: ${DRIVER_INTERNAL_TOKEN:}
  messaging:
    events-exchange: ${DRIVER_EVENTS_EXCHANGE:ride.events}
    retry-ttl-ms: ${DRIVER_RETRY_TTL_MS:5000}
    max-retry-attempts: ${DRIVER_MAX_RETRY_ATTEMPTS:3}
    outbox-delay-ms: ${DRIVER_OUTBOX_DELAY_MS:2000}
    outbox-retry-seconds: ${DRIVER_OUTBOX_RETRY_SECONDS:5}
    outbox-scheduler-enabled: ${DRIVER_OUTBOX_SCHEDULER_ENABLED:true}
spring:
  application:
    name: driver-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/driver_db?connectionTimeZone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:driver_app}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        default-requeue-rejected: false
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
