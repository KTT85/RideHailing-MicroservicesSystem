name: CI
on:
  push:
    branches: [main, develop, "feature/**", "codex/**"]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp verify
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - name: Check database ownership boundaries
        shell: bash
        run: |
          docker compose exec -T mysql bash -c '
            set -euo pipefail
            check_database() {
              MYSQL_PWD="$3" mysql --protocol=TCP -h 127.0.0.1 -u"$1" "$2" -e "SELECT DATABASE();"
            }
            check_database user_app user_db "$MYSQL_USER_PASSWORD"
            check_database driver_app driver_db "$MYSQL_DRIVER_PASSWORD"
            check_database trip_app trip_db "$MYSQL_TRIP_PASSWORD"
            check_database payment_app payment_db "$MYSQL_PAYMENT_PASSWORD"
            check_database notification_app notification_db "$MYSQL_NOTIFICATION_PASSWORD"
            if MYSQL_PWD="$MYSQL_USER_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -uuser_app driver_db -e "SELECT 1;"; then
              echo "Unexpected cross-service database access"
              exit 1
            fi
          '
      - name: Wait for service health
        shell: bash
        run: |
          for port in 8081 8082 8083 8084 8085 8086; do
            ready=false
            for attempt in $(seq 1 60); do
              if curl -fsS "http://localhost:$port/actuator/health" | jq -e '.status == "UP"' >/dev/null; then
                ready=true
                break
              fi
              sleep 3
            done
            if [ "$ready" != true ]; then
              docker compose logs
              exit 1
            fi
          done
      - name: Show container diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150
      - if: always()
        run: docker compose down
